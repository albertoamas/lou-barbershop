version: 2
updates:
  # Minor and patch bumps arrive as one grouped PR per ecosystem; majors stay separate for review.
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /src/frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Node runtime is pinned to 24 (engines, Docker, CI); keep its types on the same major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript <6.1; revisit when it adds TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-jsx-a11y and eslint-plugin-import do not support ESLint 10 yet.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: [/deploy/docker]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Node runtime is pinned to 24; move majors deliberately with engines and CI.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
