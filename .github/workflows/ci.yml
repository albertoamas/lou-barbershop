name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet tool restore
      - run: dotnet restore LouBarbershop.slnx
      - run: dotnet list LouBarbershop.slnx package --vulnerable --include-transitive
      - run: dotnet format LouBarbershop.slnx --verify-no-changes --no-restore
      - run: dotnet build LouBarbershop.slnx --configuration Release --no-restore
      - run: dotnet test LouBarbershop.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
      - name: Generate backend CycloneDX SBOM
        run: |
          dotnet tool install --tool-path .sbom-tools CycloneDX --version 6.2.0
          .sbom-tools/dotnet-CycloneDX LouBarbershop.slnx --output artifacts/sbom/backend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-backend
          path: artifacts/sbom/backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run icons:generate
      - run: git diff --exit-code -- public/icons
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run build-storybook
      - run: npm audit --audit-level=high
      - name: Generate frontend CycloneDX SBOM
        run: |
          mkdir -p ../../artifacts/sbom
          npm sbom --sbom-format cyclonedx > ../../artifacts/sbom/frontend.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-frontend
          path: artifacts/sbom/frontend.cdx.json
          if-no-files-found: error

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/docker/api.Dockerfile
          - name: web
            dockerfile: deploy/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: lou-barbershop/${{ matrix.name }}:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lou-barbershop/${{ matrix.name }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate container CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lou-barbershop/${{ matrix.name }}:ci
          format: cyclonedx
          output: ${{ matrix.name }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-container-${{ matrix.name }}
          path: ${{ matrix.name }}.cdx.json
          if-no-files-found: error

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the complete stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Verify HTTP and PWA resources
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8088/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/health/live > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/health/ready > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/manifest.webmanifest > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/icons/icon-192.png > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/icons/icon-512.png > /dev/null
          test "$(curl --silent --head http://127.0.0.1:8088/ | tr -d '\r' | grep -ci '^Content-Security-Policy:')" = "1"
          test "$(curl --silent --head http://127.0.0.1:8088/ | tr -d '\r' | grep -ci '^X-Frame-Options: DENY$')" = "1"
      - name: Verify non-root runtime users
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T web id -u)" != "0"
      - name: Verify readiness fails while liveness survives database loss
        run: |
          docker compose stop db
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/health/live)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/health/ready)" = "503"
      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  codeql:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
      - uses: github/codeql-action/analyze@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
