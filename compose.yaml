name: lou-barbershop

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lou_barbershop}
      POSTGRES_USER: ${POSTGRES_USER:-lou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lou_local_password}
      TZ: America/La_Paz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Http__UseHttpsRedirection: "false"
      ConnectionStrings__Database: Host=db;Port=5432;Database=${POSTGRES_DB:-lou_barbershop};Username=${POSTGRES_USER:-lou};Password=${POSTGRES_PASSWORD:-lou_local_password};Timeout=3;Command Timeout=10
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Http__UseHttpsRedirection: "false"
      ConnectionStrings__Database: Host=db;Port=5432;Database=${POSTGRES_DB:-lou_barbershop};Username=${POSTGRES_USER:-lou};Password=${POSTGRES_PASSWORD:-lou_local_password};Timeout=3;Command Timeout=10
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [backend, edge]

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  edge:
